name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "python_tools/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "python_tools/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q python_tools tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Guard tracked credentials
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\..*|id_rsa|id_ed25519)$'; then
            echo "Sensitive filename is tracked" >&2
            exit 1
          fi
          if git grep -nE -- 'gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- ':!python_tools/repository_security_auditor/auditor.py'; then
            echo "Credential-like pattern detected" >&2
            exit 1
          fi
