name: Question
description: Loyiha, kod yoki foydalanish bo‘yicha savol bering.
title: "[Question]: "
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Savolingiz
      description: Savolni va tegishli kontekstni aniq yozing.
