[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bahromjon-portfolio-automation-toolkit"
version = "0.2.0"
description = "Dependency-light automation and security helpers for a professional developer portfolio."
readme = "python_tools/README.md"
requires-python = ">=3.11"
authors = [{ name = "Bahromjon Mengliyev" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["python_tools*"]
